    rel="stylesheet" />
    <script>
    // Apply the saved theme, or the system preference, before first paint so there is no flash.
    (function () {
      var t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      try { var s = localStorage.getItem("blogify-theme"); if (s === "dark" || s === "light") t = s; } catch (e) { }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>

</body>
